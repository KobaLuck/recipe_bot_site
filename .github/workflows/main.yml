name: Main foodgram workflow

on:
    push:
        branches: [main]
        paths-ignore:
            - "**/*.md"
    pull_request:

jobs:
    start_on_success:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - name: its ok
              uses: appleboy/telegram-action@master
              with:
                to: ${{ secrets.TELEGRAM_TO }}
                token: ${{ secrets.TELEGRAM_TOKEN }}
                message: Workflow запущен; результаты проверок ещё не получены
    tests:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres
                env:
                    POSTGRES_USER: django_user
                    POSTGRES_PASSWORD: django_password
                    POSTGRES_DB: django_db
                    DB_HOST: 127.0.0.1
                    DB_PORT: 5432
                ports:
                    - 5432:5432
                options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

        steps:
        - name: Checkout repo
          uses: actions/checkout@v3
        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: 3.9
        - name: install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install flake8==6.0.0 flake8-isort==6.0.0
            pip install -r ./backend/requirements.txt
        #- name: test with flake8
        #  run: |
        #    python -m flake8 backend/
        - name: Run Django regression tests
          env:
            POSTGRES_DB: django_db
            POSTGRES_USER: django_user
            POSTGRES_PASSWORD: django_password
            DB_HOST: 127.0.0.1
            DB_PORT: '5432'
          run: python backend/manage.py test api.tests
    build_and_push_backend_to_docker_hub:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Push Docker image to Dockerhub
        runs-on: ubuntu-latest
        needs: tests
        steps:
            - name: Checkout repo
              uses: actions/checkout@v3
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2
            - name: Login to Docker
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}
            - name: Push to Dockerhub
              uses: docker/build-push-action@v4
              with:
                context: ./backend/
                push: true
                tags: koba101/foodgram_backend:latest
    build_frontend_and_push_to_docker_hub:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Push frontend Docker image to DockerHub
        runs-on: ubuntu-latest
        needs: tests
        steps:
            - name: Check out the repo
              uses: actions/checkout@v3
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2
            - name: Login to Docker 
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}
            - name: Push to DockerHub
              uses: docker/build-push-action@v4
              with:
                context: ./frontend
                push: true
                tags: koba101/foodgram_frontend:latest
    build_gateway_and_push_to_docker_hub:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Push gateway Docker image to DockerHub
        runs-on: ubuntu-latest
        needs: tests
        steps:
            - name: Check out the repo
              uses: actions/checkout@v3
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2
            - name: Login to Docker 
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}
            - name: Push to DockerHub
              uses: docker/build-push-action@v4
              with:
                context: ./infra
                push: true
                tags: koba101/foodgram_gateway:latest
    deploy:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        needs:
            - build_and_push_backend_to_docker_hub
            - build_frontend_and_push_to_docker_hub
            - build_gateway_and_push_to_docker_hub
        steps:
            - name: Checkout repo
              uses: actions/checkout@v3
            - name: Copy docker-compose.yml via ssh
              uses: appleboy/scp-action@master
              with:
                host: ${{ secrets.HOST }}
                username: ${{ secrets.USER }}
                key: ${{ secrets.SSH_KEY }}
                passphrase: ${{ secrets.SSH_PASSPHRASE }}
                source: "docker-compose.production.yml"
                target: "foodgram"
            - name: Executing remote ssh comands to deploy
              uses: appleboy/ssh-action@master
              with:
                host: ${{ secrets.HOST }}
                username: ${{ secrets.USER }}
                key: ${{ secrets.SSH_KEY }}
                passphrase: ${{ secrets.SSH_PASSPHRASE }}
                script: |
                    cd foodgram
                    sudo docker-compose stop
                    sudo docker-compose rm backend
                    sudo docker-compose rm frontend
                    sudo docker compose -f docker-compose.production.yml pull
                    sudo docker compose -f docker-compose.production.yml down
                    sudo docker compose -f docker-compose.production.yml up -d
                    sudo docker compose -f docker-compose.production.yml exec backend python manage.py migrate
                    sudo docker compose -f docker-compose.production.yml exec backend python manage.py collectstatic
                    sudo docker compose -f docker-compose.production.yml exec backend cp -r /app/collected_static/. /backend_static/static/
    send_message:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        needs: deploy
        steps:
            - name: Send message
              uses: appleboy/telegram-action@master
              with:
                to: ${{ secrets.TELEGRAM_TO }}
                token: ${{ secrets.TELEGRAM_TOKEN }}
                message: ебать ты красавчик, а теперь иди потрогай траву
    
    notify_failure:
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: 🔔 Notify on failure
        runs-on: ubuntu-latest
        needs:
        - tests
        - build_and_push_backend_to_docker_hub
        - build_frontend_and_push_to_docker_hub
        - build_gateway_and_push_to_docker_hub
        - deploy
        steps:
        - name: Send failure message to Telegram
          uses: appleboy/telegram-action@master
          with:
            to: ${{ secrets.TELEGRAM_TO }}
            token: ${{ secrets.TELEGRAM_TOKEN }}
            message: |
                ❌ Ержан, вставай, братан, на работу пора
                • Workflow: `${{ github.workflow }}`
                • Check run: ${{ github.run_id }}
                • URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            env:
            TZ: "Europe/Moscow"
